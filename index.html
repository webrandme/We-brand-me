<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Brand Me.-Coming Soon</title>
     <!-- ✅ ADD FAVICON HERE -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            position: relative;
        }

        /* Animated Background Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: linear-gradient(45deg, #b8ad7e, #ffffff);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Logo Container */
        .logo-container {
            position: relative;
            z-index: 10;
        }

        .logo {
            max-width: 200px;
            filter: drop-shadow(0 0 30px rgba(184, 173, 126, 0.5));
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { filter: drop-shadow(0 0 20px rgba(184, 173, 126, 0.3)); }
            100% { filter: drop-shadow(0 0 40px rgba(184, 173, 126, 0.8)); }
        }

        /* Main Title */
        .main-title {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(45deg, #b8ad7e, #ffffff, #b8ad7e);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite, titleFloat 6s ease-in-out infinite;
            text-shadow: 0 0 50px rgba(184, 173, 126, 0.5);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Countdown Timer */
        .countdown-item {
            background: linear-gradient(145deg, rgba(184, 173, 126, 0.1), rgba(184, 173, 126, 0.2));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(184, 173, 126, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 20px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1), 0 0 20px rgba(184, 173, 126, 0.2); }
            100% { box-shadow: 0 20px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1), 0 0 40px rgba(184, 173, 126, 0.4); }
        }

        /* Form Glass Effect */
        .glass-form {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(184, 173, 126, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Input Focus Effect */
        .input-focus {
            transition: all 0.3s ease;
        }

        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(184, 173, 126, 0.3);
            border-color: #b8ad7e;
        }

        /* Floating Elements */
        .floating {
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Button Hover */
        .luxury-btn {
            background: linear-gradient(45deg, #b8ad7e, #d4c8a0);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .luxury-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .luxury-btn:hover::before {
            left: 100%;
        }

        .luxury-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 25px 50px rgba(184, 173, 126, 0.4);
        }

        /* Social Icons */
        .social-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
        }

        .social-icon:hover {
            transform: translateY(-10px) scale(1.1);
            box-shadow: 0 20px 40px rgba(184, 173, 126, 0.4);
        }

        /* Scroll Indicator */
        .scroll-indicator {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Responsive */
     
    </style>
</head>
<body>
    <!-- Animated Particles Background -->
    <div class="particles" id="particles"></div>

    <div class="min-h-screen flex flex-col justify-center items-center text-white px-4 py-8 md:py-12 relative z-10">

        <!-- Logo -->
        <div class="logo-container mb-12 floating">
            <img src="LOGO.png" alt="We Brand Me" class="logo mx-auto">
        </div>

        <!-- Main Title -->
        <div class="text-center mb-8">
            <h1 class="main-title text-6xl md:text-8xl lg:text-9xl font-bold mb-6 leading-tight">
                We Brand Me.
            </h1>
            <p class="text-xl md:text-2xl text-gray-300 font-light tracking-widest">Premium Web Development • Graphics • SMMA • Ads Management</p>
        </div>

        <!-- Countdown Timer -->
       <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-16 w-full max-w-4xl mx-auto" id="countdown">

           <div class="countdown-item p-5 sm:p-6 md:p-8 rounded-3xl text-center">

               <div class="countdown-number text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold text-[#b8ad7e] mb-2" id="days">00</div>

                <div class="text-sm font-medium text-gray-300 uppercase tracking-widest">Days</div>
            </div>
           <div class="countdown-item p-5 sm:p-6 md:p-8 rounded-3xl text-center">

              <div class="countdown-number text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold text-[#b8ad7e] mb-2" id=hours">00</div>

                <div class="text-sm font-medium text-gray-300 uppercase tracking-widest">Hours</div>
            </div>
           <div class="countdown-item p-5 sm:p-6 md:p-8 rounded-3xl text-center">

               <div class="countdown-number text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold text-[#b8ad7e] mb-2" id="minutes">00</div>

                <div class="text-sm font-medium text-gray-300 uppercase tracking-widest">Minutes</div>
            </div>
           <div class="countdown-item p-5 sm:p-6 md:p-8 rounded-3xl text-center">

               <div class="countdown-number text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold text-[#b8ad7e] mb-2" id="seconds">00</div>

                <div class="text-sm font-medium text-gray-300 uppercase tracking-widest">Seconds</div>
            </div>
        </div>

        <!-- Contact Form -->
        <div class="glass-form rounded-3xl p-12 w-full max-w-2xl mx-auto mb-20">
            <h3 class="text-3xl md:text-4xl font-bold text-center mb-12 bg-gradient-to-r from-[#b8ad7e] to-white bg-clip-text text-transparent">
                Get Early Access
            </h3>
            <form id="contactForm" action="https://formsubmit.co/we.brand.mee@gmail.com" method="POST" class="space-y-6">
                <div>
                    <input type="text" id="name" name="name" placeholder="Your Name" required
                           class="w-full p-5 rounded-2xl bg-white/10 backdrop-blur-sm border border-white/20 text-white placeholder-gray-400 input-focus focus:outline-none focus:ring-4 focus:ring-[#b8ad7e]/30 font-medium">
                </div>
                <div>
                    <input type="tel" id="phone" name="phone" placeholder="Phone Number" required
                           class="w-full p-5 rounded-2xl bg-white/10 backdrop-blur-sm border border-white/20 text-white placeholder-gray-400 input-focus focus:outline-none focus:ring-4 focus:ring-[#b8ad7e]/30 font-medium">
                </div>
                <div>
                    <textarea id="query" name="query" rows="4" placeholder="Tell us about your project..." required
                              class="w-full p-5 rounded-2xl bg-white/10 backdrop-blur-sm border border-white/20 text-white placeholder-gray-400 input-focus focus:outline-none focus:ring-4 focus:ring-[#b8ad7e]/30 font-medium resize-none"></textarea>
                </div>
                <button type="submit" class="luxury-btn w-full py-6 px-8 rounded-3xl text-xl font-bold text-black shadow-2xl uppercase tracking-wider">
                    Reserve Your Spot
                    <i class="fas fa-arrow-right ml-4"></i>
                </button>
            </form>
           <input type="hidden" name="_subject" value="New Lead from We Brand Me Website">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
            <p id="formMessage" class="text-center mt-6 hidden text-lg font-medium"></p>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator animate-bounce text-[#b8ad7e] text-2xl mb-8">
            <i class="fas fa-chevron-down"></i>
        </div>
    </div>

    <!-- Footer -->
    <footer class="glass-form rounded-t-3xl p-12 mt-auto w-full">
        <div class="max-w-4xl mx-auto text-center">
            <p class="text-xl md:text-2xl font-light text-gray-300 mb-8">
                Launching 18th March 2026 • 1:00 PM IST
            </p>
            <div class="flex justify-center space-x-8 mb-8">
                <a href="https://instagram.com/we.brand.me" class="social-icon bg-white/10 rounded-2xl border border-white/20 text-[#b8ad7e] hover:text-white hover:bg-[#b8ad7e]/20">
                    <i class="fab fa-instagram text-2xl"></i>
                </a>
                <a href="https://youtube.com/@webrandme?si=Wv8IHIFHqpUD23am" class="social-icon bg-white/10 rounded-2xl border border-white/20 text-[#b8ad7e] hover:text-white hover:bg-[#b8ad7e]/20">
                    <i class="fab fa-youtube text-2xl"></i>
                </a>
                <a href="https://x.com/We_Brand_Me" class="social-icon bg-white/10 rounded-2xl border border-white/20 text-[#b8ad7e] hover:text-white hover:bg-[#b8ad7e]/20">
                   <i class="fa-solid fa-x fa-2xl"></i>
                </a>
            </div>
            <p class="text-gray-400 text-sm">&copy; 2026 We Brand Me. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Create Animated Particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = (Math.random() * 4 + 1) + 'px';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Countdown Timer
        function updateCountdown() {
            const launchDate = new Date('2026-03-18T13:00:00').getTime();
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');

            if (distance < 0) {
                document.getElementById('countdown').innerHTML = '<h2 class="col-span-4 text-5xl md:text-7xl font-bold text-[#b8ad7e] text-center">We Are Live!</h2>';
            }
        }

        // Google Sheet Integration
     

        // Initialize
        createParticles();
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Add floating animation to elements
        document.querySelectorAll('.floating').forEach((el, index) => {
            el.style.animationDelay = index * 200 + 'ms';
        });
    </script>
</body>
</html>
